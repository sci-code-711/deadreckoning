<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Construction diagram: the tangent at p0 is the slope of the line from the before-sample to p1; the tangent at p1 is the slope of the line from p0 to the after-sample; the plain secant from p0 to p1 is shown for comparison.">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --secant: #8a8a8a;
      --m0: #2563eb;
      --m1: #d9480f;
      --point: #1a1a1a;
      --ctxpoint: #9a9a9a;
      --band: #eef1ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --ink: #e8e8e8;
        --muted: #9a9a9a;
        --secant: #9a9a9a;
        --m0: #6ea8fe;
        --m1: #ff9066;
        --point: #e8e8e8;
        --ctxpoint: #6b6e76;
        --band: #20233a;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect x="0" y="0" width="640" height="390" fill="var(--bg)" />

  <!-- shaded band marking the actual interpolated step -->
  <rect x="240" y="30" width="180" height="310" fill="var(--band)" />

  <!-- axis -->
  <line x1="40" y1="340" x2="620" y2="340" stroke="var(--ink)" stroke-width="1" />
  <g stroke="var(--ink)" stroke-width="1">
    <line x1="60" y1="340" x2="60" y2="346" />
    <line x1="240" y1="340" x2="240" y2="346" />
    <line x1="420" y1="340" x2="420" y2="346" />
    <line x1="600" y1="340" x2="600" y2="346" />
  </g>
  <g fill="var(--muted)" font-size="12" text-anchor="middle">
    <text x="60" y="362">t=&#8722;1</text>
    <text x="240" y="362">t=0</text>
    <text x="420" y="362">t=1</text>
    <text x="600" y="362">t=2</text>
  </g>
  <text x="330" y="24" fill="var(--muted)" font-size="12" text-anchor="middle">the interpolated step</text>

  <!-- construction secant: before -> p1, gives m0 -->
  <line x1="60" y1="310" x2="420" y2="205" stroke="var(--m0)" stroke-width="2" stroke-dasharray="6 5" />
  <text x="150" y="266" fill="var(--m0)" font-size="13">m0 = (9&#8722;2)/(1&#8722;(&#8722;1)) = 3.5</text>

  <!-- construction secant: p0 -> after, gives m1 -->
  <line x1="240" y1="265" x2="600" y2="40" stroke="var(--m1)" stroke-width="2" stroke-dasharray="6 5" />
  <text x="470" y="98" fill="var(--m1)" font-size="13">m1 = (20&#8722;5)/(2&#8722;0) = 7.5</text>

  <!-- plain 2-point secant p0 -> p1, for reference -->
  <line x1="240" y1="265" x2="420" y2="205" stroke="var(--secant)" stroke-width="2.5" />
  <text x="270" y="292" fill="var(--secant)" font-size="13">plain secant = (9&#8722;5)/(1&#8722;0) = 4</text>

  <!-- points -->
  <circle cx="60" cy="310" r="5" fill="var(--ctxpoint)" />
  <circle cx="240" cy="265" r="6" fill="var(--point)" />
  <circle cx="420" cy="205" r="6" fill="var(--point)" />
  <circle cx="600" cy="40" r="5" fill="var(--ctxpoint)" />

  <g font-size="13" text-anchor="middle" fill="var(--ink)">
    <text x="60" y="296">before</text>
    <text x="240" y="251">p0 (step start)</text>
    <text x="420" y="191">p1 (step end)</text>
    <text x="600" y="58">after</text>
  </g>
</svg>
