name: Python Package using uv

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: uv sync
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Test with pytest
      run: uv run pytest
